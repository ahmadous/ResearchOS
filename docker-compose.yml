services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: researchos
      POSTGRES_DB: researchos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    command: flask --app wsgi:app run --host 0.0.0.0 --port 5000
    environment:
      FLASK_CONFIG: dev
      DATABASE_URL: postgresql+psycopg2://researchos:researchos@db:5432/researchos
      REDIS_URL: redis://redis:6379/0
    ports: ["5000:5000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
